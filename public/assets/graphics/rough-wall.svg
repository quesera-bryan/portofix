<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="granite-mottle">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <filter id="granite-relief">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" stitchTiles="stitch" result="stone" />
    <feDiffuseLighting in="stone" surfaceScale="5" diffuseConstant="0.8" lighting-color="#777777">
      <feDistantLight azimuth="225" elevation="55" />
    </feDiffuseLighting>
  </filter>
  <filter id="granite-flecks">
    <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="4" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
    <feComponentTransfer in="gray">
      <feFuncR type="linear" slope="4.6" intercept="-1.7" />
      <feFuncG type="linear" slope="4.6" intercept="-1.7" />
      <feFuncB type="linear" slope="4.6" intercept="-1.7" />
    </feComponentTransfer>
  </filter>
  <filter id="granite-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="100%" height="100%" filter="url(#granite-mottle)" opacity="0.26" />
  <rect width="100%" height="100%" filter="url(#granite-relief)" opacity="0.22" />
  <rect width="100%" height="100%" filter="url(#granite-grain)" opacity="0.4" />
  <rect width="100%" height="100%" filter="url(#granite-flecks)" opacity="0.62" />
</svg>
